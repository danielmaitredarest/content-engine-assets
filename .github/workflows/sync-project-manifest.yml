name: Sync project asset manifest
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project folder name
        required: true
        type: string
  issues:
    types: [opened]
permissions:
  contents: write
concurrency:
  group: content-engine-manifest-write
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Sync project manifest - ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh main
        run: git pull --ff-only origin main
      - name: Resolve project
        id: project
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT="${{ inputs.project }}"
          else
            PROJECT="${{ github.event.issue.title }}"
            PROJECT="${PROJECT#Sync project manifest - }"
          fi
          test -d "$PROJECT"
          echo "name=$PROJECT" >> "$GITHUB_OUTPUT"
      - name: Sync manifest
        env:
          PROJECT: ${{ steps.project.outputs.name }}
        run: |
          python - <<'PY'
          import csv, hashlib, os
          from datetime import date
          project=os.environ['PROJECT']
          manifest='manifest.csv'
          fields=['asset_id','project','relative_path','filename','source_type','source_url','source_reference','created_at','sha256','channels','github_path','github_public_url','status','notes']
          source_refs={
            'askit-ai':'danielmaitredarest/askit-ai',
            'falcification':'danielmaitredarest/facile-texte-clarifier',
            'propulsa':'danielmaitredarest/autopilot-digital-cockpit',
            'relumo':'danielmaitredarest/aurora-forge-tech',
            'myswissinvoice':'danielmaitredarest/qr-bill-pal',
          }
          rows=[]
          if os.path.exists(manifest):
            with open(manifest,newline='',encoding='utf-8') as h:
              rows=list(csv.DictReader(h))
          rows=[r for r in rows if r.get('project')!=project]
          for root,_,files in os.walk(project):
            for fn in sorted(files):
              if fn=='.gitkeep': continue
              p=os.path.join(root,fn).replace('\\','/')
              sha=hashlib.sha256(open(p,'rb').read()).hexdigest()
              rel=p[len(project)+1:]
              aid=project+'-'+rel.rsplit('.',1)[0].replace('/','-').replace('_','-')
              rows.append({
                'asset_id':aid,'project':project,'relative_path':p,'filename':fn,
                'source_type':'source_repo_asset','source_url':'',
                'source_reference':source_refs.get(project,'first-party-source'),
                'created_at':str(date.today()),'sha256':sha,'channels':'',
                'github_path':p,
                'github_public_url':'https://raw.githubusercontent.com/danielmaitredarest/content-engine-assets/main/'+p,
                'status':'ready','notes':'Existing first-party asset imported from the project source repository.'
              })
          with open(manifest,'w',newline='',encoding='utf-8') as h:
            w=csv.DictWriter(h,fieldnames=fields);w.writeheader();w.writerows(rows)
          PY
      - name: Commit manifest
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add manifest.csv
          if ! git diff --cached --quiet; then
            git commit -m "Sync ${{ steps.project.outputs.name }} asset manifest"
            git push
          fi
