name: Import A Photographie public asset lot

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import:
    if: startsWith(github.event.issue.title, 'Aphoto import lot trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and normalize selected public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aphotographie/portfolio /tmp/apho

          convert_asset() {
            url="$1"; out="$2"; tmp="/tmp/apho/$(basename "$out").webp"
            curl -LfsS "$url" -o "$tmp"
            if command -v magick >/dev/null 2>&1; then
              magick "$tmp" -auto-orient -resize '2000x2000>' -strip -quality 90 "$out"
            elif command -v convert >/dev/null 2>&1; then
              convert "$tmp" -auto-orient -resize '2000x2000>' -strip -quality 90 "$out"
            else
              ffmpeg -loglevel error -y -i "$tmp" -vf "scale=2000:2000:force_original_aspect_ratio=decrease" -q:v 2 "$out"
            fi
          }

          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/ab1ffcb6-df27-49e6-aea1-fd28b5826a92/1767089957640-0K6A7839.webp" "aphotographie/portfolio/aphotographie-architecture-interieur-geneve-01.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/1f225aa7-afe0-49a7-a015-879075f90415/1767094131693-0K6A0157.webp" "aphotographie/portfolio/aphotographie-bijouterie-joaillerie-geneve-01.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/62158455-1fe9-4acc-b90c-4d7ade13ef16/1767105250775-0K6A6885-min.webp" "aphotographie/portfolio/aphotographie-evenementiel-conference-geneve-01.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/660bd674-57a4-483c-bfa9-94385dff3572/converted-1766994327875.webp" "aphotographie/portfolio/aphotographie-culinaire-gastronomie-geneve-01.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/resized/1767002275641-1766999877871-1766962576624-1-resized.webp" "aphotographie/portfolio/aphotographie-culinaire-restaurant-geneve-02.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/df1c5540-f0b3-498d-a4f7-1e0f30024de2/1767092047631-0K6A3276-2.webp" "aphotographie/portfolio/aphotographie-produit-packshot-geneve-01.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/f1b72fda-8a15-47c2-8b92-bd671ca92722/1767089368146-0K6A5719.webp" "aphotographie/portfolio/aphotographie-metiers-horlogerie-geneve-01.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/f1b72fda-8a15-47c2-8b92-bd671ca92722/1767087522982-0K6A5490.webp" "aphotographie/portfolio/aphotographie-metiers-artisan-geneve-02.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/2bbecbd8-e820-46e3-b4a4-ed3ce8099608/1767094681414-0K6A5166.webp" "aphotographie/portfolio/aphotographie-mode-editorial-geneve-01.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/1c8e5b1a-06f0-4519-b256-b836105955ba/1769964105337-0K6A1506.webp" "aphotographie/portfolio/aphotographie-portrait-artistique-geneve-01.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/1c8e5b1a-06f0-4519-b256-b836105955ba/1769964107385-0K6A1244.webp" "aphotographie/portfolio/aphotographie-portrait-studio-geneve-02.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/1c8e5b1a-06f0-4519-b256-b836105955ba/1779377786547-1P2A6062.webp" "aphotographie/portfolio/aphotographie-portrait-professionnel-geneve-03.jpg"

      - name: Update public manifest
        shell: python
        run: |
          import csv, hashlib, os
          specs = [
            ("aphotographie-portfolio-architecture-01","aphotographie/portfolio/aphotographie-architecture-interieur-geneve-01.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/ab1ffcb6-df27-49e6-aea1-fd28b5826a92/1767089957640-0K6A7839.webp","aphotographie-public-cms:673e156a"),
            ("aphotographie-portfolio-bijouterie-01","aphotographie/portfolio/aphotographie-bijouterie-joaillerie-geneve-01.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/1f225aa7-afe0-49a7-a015-879075f90415/1767094131693-0K6A0157.webp","aphotographie-public-cms:70dd5d4a"),
            ("aphotographie-portfolio-evenementiel-01","aphotographie/portfolio/aphotographie-evenementiel-conference-geneve-01.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/62158455-1fe9-4acc-b90c-4d7ade13ef16/1767105250775-0K6A6885-min.webp","aphotographie-public-cms:10372036"),
            ("aphotographie-portfolio-culinaire-01","aphotographie/portfolio/aphotographie-culinaire-gastronomie-geneve-01.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/660bd674-57a4-483c-bfa9-94385dff3572/converted-1766994327875.webp","aphotographie-public-cms:2ff48c25"),
            ("aphotographie-portfolio-culinaire-02","aphotographie/portfolio/aphotographie-culinaire-restaurant-geneve-02.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/resized/1767002275641-1766999877871-1766962576624-1-resized.webp","aphotographie-public-cms:f66e483e"),
            ("aphotographie-portfolio-produit-01","aphotographie/portfolio/aphotographie-produit-packshot-geneve-01.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/df1c5540-f0b3-498d-a4f7-1e0f30024de2/1767092047631-0K6A3276-2.webp","aphotographie-public-cms:efdf649f"),
            ("aphotographie-portfolio-metiers-01","aphotographie/portfolio/aphotographie-metiers-horlogerie-geneve-01.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/f1b72fda-8a15-47c2-8b92-bd671ca92722/1767089368146-0K6A5719.webp","aphotographie-public-cms:fb6d903a"),
            ("aphotographie-portfolio-metiers-02","aphotographie/portfolio/aphotographie-metiers-artisan-geneve-02.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/f1b72fda-8a15-47c2-8b92-bd671ca92722/1767087522982-0K6A5490.webp","aphotographie-public-cms:9b741163"),
            ("aphotographie-portfolio-mode-01","aphotographie/portfolio/aphotographie-mode-editorial-geneve-01.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/2bbecbd8-e820-46e3-b4a4-ed3ce8099608/1767094681414-0K6A5166.webp","aphotographie-public-cms:bc69f9f3"),
            ("aphotographie-portfolio-portrait-01","aphotographie/portfolio/aphotographie-portrait-artistique-geneve-01.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/1c8e5b1a-06f0-4519-b256-b836105955ba/1769964105337-0K6A1506.webp","aphotographie-public-cms:c6431f3e"),
            ("aphotographie-portfolio-portrait-02","aphotographie/portfolio/aphotographie-portrait-studio-geneve-02.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/1c8e5b1a-06f0-4519-b256-b836105955ba/1769964107385-0K6A1244.webp","aphotographie-public-cms:80a936ca"),
            ("aphotographie-portfolio-portrait-03","aphotographie/portfolio/aphotographie-portrait-professionnel-geneve-03.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/1c8e5b1a-06f0-4519-b256-b836105955ba/1779377786547-1P2A6062.webp","aphotographie-public-cms:fd85a5a9"),
          ]
          manifest="manifest.csv"
          with open(manifest,newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
              fieldnames=f.seek(0) or None
          with open(manifest,newline="",encoding="utf-8") as f:
              reader=csv.DictReader(f)
              fields=reader.fieldnames
              existing=list(reader)
          ids={r["asset_id"] for r in existing}
          for asset_id,path,source_url,source_reference in specs:
              if asset_id in ids:
                  continue
              with open(path,"rb") as f:
                  sha=hashlib.sha256(f.read()).hexdigest()
              existing.append({
                "asset_id":asset_id,
                "project":"aphotographie",
                "relative_path":path,
                "filename":os.path.basename(path),
                "source_type":"public_portfolio",
                "source_url":source_url,
                "source_reference":source_reference,
                "created_at":"2026-09-19",
                "sha256":sha,
                "channels":"",
                "github_path":path,
                "github_public_url":"https://raw.githubusercontent.com/danielmaitredarest/content-engine-assets/main/"+path,
                "status":"ready",
                "notes":"Selected from photographs already published in the public A. Photographie portfolio."
              })
          with open(manifest,"w",newline="",encoding="utf-8") as f:
              writer=csv.DictWriter(f,fieldnames=fields)
              writer.writeheader(); writer.writerows(existing)

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add aphotographie/portfolio manifest.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add curated A. Photographie public asset library"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aphotographie-imported-jpg
          path: aphotographie/portfolio/*.jpg
          retention-days: 1
