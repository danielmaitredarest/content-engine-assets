name: Import A Photographie public assets

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Aphoto import 5')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch five additional public images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p aphotographie/portfolio /tmp/apho
          convert_asset() {
            url="$1"; out="$2"; tmp="/tmp/apho/$(basename "$out").webp"
            curl -LfsS "$url" -o "$tmp"
            python3 -c 'from PIL import Image,ImageOps; import sys; src,dst=sys.argv[1],sys.argv[2]; im=ImageOps.exif_transpose(Image.open(src)).convert("RGB"); im.thumbnail((2000,2000),Image.Resampling.LANCZOS); im.save(dst,"JPEG",quality=90,optimize=True,progressive=True)' "$tmp" "$out"
          }
          convert_asset "https://aphotographie.ch/blog/geneve-ville-monde-culinaire.webp" "aphotographie/portfolio/aphotographie-geneve-ville-monde-culinaire-01.jpg"
          convert_asset "https://aphotographie.ch/blog/offrir-seance-photo-cadeau.webp" "aphotographie/portfolio/aphotographie-seance-photo-cadeau-geneve-01.jpg"
          convert_asset "https://aphotographie.ch/blog/secrets-portrait-reussi.webp" "aphotographie/portfolio/aphotographie-portrait-conseils-geneve-01.jpg"
          convert_asset "https://aphotographie.ch/blog/parcours-photographe-autodidacte.webp" "aphotographie/portfolio/aphotographie-photographe-autodidacte-geneve-01.jpg"
          convert_asset "https://aphotographie.ch/blog/photos-anciennes-emotions.webp" "aphotographie/portfolio/aphotographie-photos-emotions-geneve-01.jpg"
      - name: Update public manifest
        shell: python
        run: |
          import csv,hashlib,os
          specs=[
            ("aphotographie-blog-culinaire-geneve-01","aphotographie/portfolio/aphotographie-geneve-ville-monde-culinaire-01.jpg","https://aphotographie.ch/blog/geneve-ville-monde-culinaire.webp","aphotographie-public-blog:geneve-ville-monde-culinaire"),
            ("aphotographie-blog-cadeau-01","aphotographie/portfolio/aphotographie-seance-photo-cadeau-geneve-01.jpg","https://aphotographie.ch/blog/offrir-seance-photo-cadeau.webp","aphotographie-public-blog:offrir-seance-photo-cadeau"),
            ("aphotographie-blog-portrait-01","aphotographie/portfolio/aphotographie-portrait-conseils-geneve-01.jpg","https://aphotographie.ch/blog/secrets-portrait-reussi.webp","aphotographie-public-blog:secrets-portrait-reussi"),
            ("aphotographie-blog-autodidacte-01","aphotographie/portfolio/aphotographie-photographe-autodidacte-geneve-01.jpg","https://aphotographie.ch/blog/parcours-photographe-autodidacte.webp","aphotographie-public-blog:parcours-photographe-autodidacte"),
            ("aphotographie-blog-emotions-01","aphotographie/portfolio/aphotographie-photos-emotions-geneve-01.jpg","https://aphotographie.ch/blog/photos-anciennes-emotions.webp","aphotographie-public-blog:photos-anciennes-emotions")
          ]
          with open("manifest.csv",newline="",encoding="utf-8") as f:
            rd=csv.DictReader(f); fields=rd.fieldnames; rows=list(rd)
          ids={r["asset_id"] for r in rows}
          for aid,path,url,ref in specs:
            if aid in ids: continue
            sha=hashlib.sha256(open(path,"rb").read()).hexdigest()
            rows.append({"asset_id":aid,"project":"aphotographie","relative_path":path,"filename":os.path.basename(path),"source_type":"public_site","source_url":url,"source_reference":ref,"created_at":"2026-09-19","sha256":sha,"channels":"","github_path":path,"github_public_url":"https://raw.githubusercontent.com/danielmaitredarest/content-engine-assets/main/"+path,"status":"ready","notes":"Public A. Photographie image mirrored for Content Engine reuse."})
          with open("manifest.csv","w",newline="",encoding="utf-8") as f:
            wr=csv.DictWriter(f,fieldnames=fields); wr.writeheader(); wr.writerows(rows)
      - name: Commit
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add aphotographie/portfolio manifest.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add five more A. Photographie public assets"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aphotographie-five-public-assets
          path: |
            aphotographie/portfolio/aphotographie-geneve-ville-monde-culinaire-01.jpg
            aphotographie/portfolio/aphotographie-seance-photo-cadeau-geneve-01.jpg
            aphotographie/portfolio/aphotographie-portrait-conseils-geneve-01.jpg
            aphotographie/portfolio/aphotographie-photographe-autodidacte-geneve-01.jpg
            aphotographie/portfolio/aphotographie-photos-emotions-geneve-01.jpg
          retention-days: 1
