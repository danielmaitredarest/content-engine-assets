name: Sync Altio asset manifest
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Sync Altio manifest')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Altio manifest rows
        run: |
          python - <<'PY'
          import csv, hashlib, os
          from datetime import date
          manifest='manifest.csv'
          fields=['asset_id','project','relative_path','filename','source_type','source_url','source_reference','created_at','sha256','channels','github_path','github_public_url','status','notes']
          rows=[]
          if os.path.exists(manifest):
            with open(manifest,newline='',encoding='utf-8') as h: rows=list(csv.DictReader(h))
          rows=[r for r in rows if r.get('project')!='altio']
          for root,_,files in os.walk('altio'):
            for fn in sorted(files):
              if fn=='.gitkeep': continue
              p=os.path.join(root,fn).replace('\\','/')
              sha=hashlib.sha256(open(p,'rb').read()).hexdigest()
              rel=p[len('altio/'):]
              typ='source_repo_asset' if (fn.startswith('source-') or fn.endswith('.webp') or fn in ('og-image.png','altio-logo-blue.png')) else 'public_capture'
              source='danielmaitredarest/webforge-briefly' if typ=='source_repo_asset' else ''
              aid='altio-'+rel.rsplit('.',1)[0].replace('/','-').replace('_','-')
              rows.append({'asset_id':aid,'project':'altio','relative_path':p,'filename':fn,'source_type':typ,
                'source_url':'','source_reference':source,'created_at':str(date.today()),'sha256':sha,'channels':'',
                'github_path':p,'github_public_url':'https://raw.githubusercontent.com/danielmaitredarest/content-engine-assets/main/'+p,
                'status':'ready','notes':'Existing first-party Altio asset imported from source repository.' if typ=='source_repo_asset' else 'Reusable public capture; consent overlays removed before capture.'})
          with open(manifest,'w',newline='',encoding='utf-8') as h:
            w=csv.DictWriter(h,fieldnames=fields);w.writeheader();w.writerows(rows)
          PY
      - name: Commit manifest
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add manifest.csv
          if ! git diff --cached --quiet; then
            git commit -m "Sync Altio asset manifest"
            git push
          fi
