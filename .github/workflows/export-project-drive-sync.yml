name: Export project Drive sync
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project folder name
        required: true
        type: string
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Export project Drive sync - ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve project
        id: project
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT="${{ inputs.project }}"
          else
            PROJECT="${{ github.event.issue.title }}"
            PROJECT="${PROJECT#Export project Drive sync - }"
          fi
          test -d "$PROJECT"
          echo "name=$PROJECT" >> "$GITHUB_OUTPUT"
      - name: Package project assets
        run: |
          zip -qr "${{ steps.project.outputs.name }}-drive-sync.zip" "${{ steps.project.outputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.project.outputs.name }}-drive-sync
          path: ${{ steps.project.outputs.name }}-drive-sync.zip
          retention-days: 3
