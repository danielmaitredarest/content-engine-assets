name: Package FALCification Drive sync
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Package FALCification Drive sync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files
        run: |
          mkdir -p /tmp/falcification-drive-sync
          find falcification -type f ! -name '.gitkeep' -print0 | while IFS= read -r -d '' f; do
            mkdir -p "/tmp/falcification-drive-sync/$(dirname "$f")"
            cp "$f" "/tmp/falcification-drive-sync/$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: falcification-drive-sync
          path: /tmp/falcification-drive-sync
          retention-days: 2
