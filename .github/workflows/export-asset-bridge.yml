name: Export asset bridge

on:
  push:
    paths:
      - ".github/workflows/export-asset-bridge.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: aphotographie-hero-studio-01
          path: aphotographie/site/aphotographie-hero-studio-01.jpg
          if-no-files-found: error
          retention-days: 1
