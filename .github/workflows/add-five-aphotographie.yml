name: Add five A Photographie assets
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  add:
    if: startsWith(github.event.issue.title, 'Aphoto add 5 trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch five additional public portfolio images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p aphotographie/portfolio /tmp/apho
          convert_asset() {
            url="$1"; out="$2"; tmp="/tmp/apho/$(basename "$out").webp"
            curl -LfsS "$url" -o "$tmp"
            python3 -c 'from PIL import Image,ImageOps; import sys; src,dst=sys.argv[1],sys.argv[2]; im=ImageOps.exif_transpose(Image.open(src)).convert("RGB"); im.thumbnail((2000,2000),Image.Resampling.LANCZOS); im.save(dst,"JPEG",quality=90,optimize=True,progressive=True)' "$tmp" "$out"
          }
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/resized/1767002285484-1766999891063-1766962579771-4-resized.webp" "aphotographie/portfolio/aphotographie-culinaire-restaurant-geneve-03.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/f1b72fda-8a15-47c2-8b92-bd671ca92722/1767089340761-0K6A5665.webp" "aphotographie/portfolio/aphotographie-metiers-artisan-geneve-03.jpg"
          convert_asset "https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/0609a25f-3c4e-4996-9aa5-b9f2ea64b0e1/1767095090540-0K6A6390.webp" "aphotographie/portfolio/aphotographie-mariage-geneve-01.jpg"
          SUPABASE_URL=https://yaronpzislkfetwrihfs.supabase.co
          SUPABASE_KEY=$(curl -fsSL https://raw.githubusercontent.com/danielmaitredarest/aphotographie/main/.env | grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '"')
          curl -fsSL "$SUPABASE_URL/rest/v1/photos?select=id,category_id,image_url,display_order&order=display_order.asc" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" > /tmp/photos.json
          jq -r '[.[] | select(.image_url != null)] | unique_by(.category_id) | .[] | [.image_url,.id,.category_id] | @tsv' /tmp/photos.json | grep -v -E '1767089957640|1767094131693|1767105250775|converted-1766994327875|1767002275641|1767092047631|1767089368146|1767087522982|1767094681414|1769964105337|1769964107385|1779377786547|1767002285484|1767089340761|1767095090540' | head -n 2 | tr '\t' '|' > /tmp/extra_urls.txt
          n=0
          while IFS='|' read -r url id cat; do
            n=$((n+1))
            convert_asset "$url" "aphotographie/portfolio/aphotographie-portfolio-selection-geneve-0__N__.jpg"
            mv "aphotographie/portfolio/aphotographie-portfolio-selection-geneve-0__N__.jpg" "aphotographie/portfolio/aphotographie-portfolio-selection-geneve-0$n.jpg"
            echo "$id|$cat|$url" >> /tmp/extra_meta.txt
          done < /tmp/extra_urls.txt
          test "$n" -eq 2
      - name: Update manifest
        shell: python
        run: |
          import csv,hashlib,os
          specs=[
           ("aphotographie-portfolio-culinaire-03","aphotographie/portfolio/aphotographie-culinaire-restaurant-geneve-03.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/resized/1767002285484-1766999891063-1766962579771-4-resized.webp","aphotographie-public-cms:additional-food"),
           ("aphotographie-portfolio-metiers-03","aphotographie/portfolio/aphotographie-metiers-artisan-geneve-03.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/f1b72fda-8a15-47c2-8b92-bd671ca92722/1767089340761-0K6A5665.webp","aphotographie-public-cms:additional-metiers"),
           ("aphotographie-portfolio-mariage-01","aphotographie/portfolio/aphotographie-mariage-geneve-01.jpg","https://yaronpzislkfetwrihfs.supabase.co/storage/v1/object/public/photos/0609a25f-3c4e-4996-9aa5-b9f2ea64b0e1/1767095090540-0K6A6390.webp","aphotographie-public-cms:additional-mariage")]
          for idx,line in enumerate(open("/tmp/extra_meta.txt"),1):
            i,c,u=line.strip().split("|",2)
            specs.append((f"aphotographie-portfolio-selection-0{idx}",f"aphotographie/portfolio/aphotographie-portfolio-selection-geneve-0{idx}.jpg",u,f"aphotographie-public-cms:{i}"))
          with open("manifest.csv",newline="",encoding="utf-8") as f:
            rd=csv.DictReader(f); fields=rd.fieldnames; rows=list(rd)
          ids={r["asset_id"] for r in rows}
          for aid,path,url,ref in specs:
            if aid in ids: continue
            sha=hashlib.sha256(open(path,"rb").read()).hexdigest()
            rows.append({"asset_id":aid,"project":"aphotographie","relative_path":path,"filename":os.path.basename(path),"source_type":"public_portfolio","source_url":url,"source_reference":ref,"created_at":"2026-09-19","sha256":sha,"channels":"","github_path":path,"github_public_url":"https://raw.githubusercontent.com/danielmaitredarest/content-engine-assets/main/"+path,"status":"ready","notes":"Additional asset selected from the public A. Photographie portfolio."})
          with open("manifest.csv","w",newline="",encoding="utf-8") as f:
            wr=csv.DictWriter(f,fieldnames=fields); wr.writeheader(); wr.writerows(rows)
      - name: Commit
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add aphotographie/portfolio manifest.csv
          git commit -m "Add five more A. Photographie public assets"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: aphotographie-five-more
          path: |
            aphotographie/portfolio/aphotographie-culinaire-restaurant-geneve-03.jpg
            aphotographie/portfolio/aphotographie-metiers-artisan-geneve-03.jpg
            aphotographie/portfolio/aphotographie-mariage-geneve-01.jpg
            aphotographie/portfolio/aphotographie-portfolio-selection-geneve-01.jpg
            aphotographie/portfolio/aphotographie-portfolio-selection-geneve-02.jpg
          retention-days: 1
