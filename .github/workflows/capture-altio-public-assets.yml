name: Capture Altio public assets
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Capture Altio public assets')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Capture Altio pages
        run: |
          mkdir -p altio/site altio/realisations
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
          const shots=[
            ['https://altio.ch/','altio/site/altio-homepage.jpg',2500],
            ['https://altio.ch/services','altio/site/altio-services.jpg',2500],
            ['https://altio.ch/realisations','altio/realisations/altio-portfolio-overview.jpg',3500],
            ['https://nessfo.ch/en','altio/realisations/ness.jpg',3000],
            ['https://runigma.com/b2c','altio/realisations/runigma-b2c.jpg',4500],
            ['https://maisonsama.ch/','altio/realisations/maison-sama.jpg',3000],
            ['https://rooftop.altio.ch/','altio/realisations/rooftop-105.jpg',4000],
            ['https://gpaley.ch/fr','altio/realisations/gerard-paley.jpg',3000],
            ['https://marcus.altio.ch/','altio/realisations/marcus.jpg',5500],
            ['https://myswissinvoice.ch/','altio/realisations/myswissinvoice.jpg',3000],
            ['https://relumo.ch/','altio/realisations/relumo.jpg',3000],
            ['https://propulsa.ch/','altio/realisations/propulsa.jpg',3000],
          ];
          for (const [url,file,wait] of shots){
            try {
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForLoadState('networkidle',{timeout:20000}).catch(()=>{});
              await page.waitForTimeout(wait);
              // Remove cookie/consent overlays from reusable captures only.
              await page.evaluate(() => {
                const needles=['cookie','cookies','consent','tarteaucitron','axeptio','didomi','cmp','rgpd'];
                for (const el of document.querySelectorAll('body *')) {
                  const id=(el.id||'').toLowerCase(), cls=(typeof el.className==='string'?el.className:'').toLowerCase();
                  const aria=(el.getAttribute('aria-label')||'').toLowerCase();
                  const role=(el.getAttribute('role')||'').toLowerCase();
                  const txt=(el.textContent||'').trim().toLowerCase();
                  const s=getComputedStyle(el);
                  const fixed=s.position==='fixed'||s.position==='sticky';
                  const hint=needles.some(n=>id.includes(n)||cls.includes(n)||aria.includes(n));
                  const consentText=(txt.includes('cookie')||txt.includes('consentement')) && (txt.includes('accepter')||txt.includes('refuser')||txt.includes('préférences'));
                  if ((hint||consentText) && (fixed||role==='dialog')) el.remove();
                }
                document.documentElement.style.overflow='auto';
                document.body.style.overflow='auto';
              }).catch(()=>{});
              await page.screenshot({path:file,type:'jpeg',quality:90,fullPage:false});
            } catch(e) { console.error('SKIP',url,e.message); }
          }
          await browser.close();
          JS
          node capture.mjs
      - name: Update Altio manifest
        run: |
          python - <<'PY'
          import csv, hashlib, os
          from datetime import date
          manifest='manifest.csv'
          fields=['asset_id','project','relative_path','filename','source_type','source_url','source_reference','created_at','sha256','channels','github_path','github_public_url','status','notes']
          urls={
            'altio/site/altio-homepage.jpg':'https://altio.ch/',
            'altio/site/altio-services.jpg':'https://altio.ch/services',
            'altio/realisations/altio-portfolio-overview.jpg':'https://altio.ch/realisations',
            'altio/realisations/ness.jpg':'https://nessfo.ch/en',
            'altio/realisations/runigma-b2c.jpg':'https://runigma.com/b2c',
            'altio/realisations/maison-sama.jpg':'https://maisonsama.ch/',
            'altio/realisations/rooftop-105.jpg':'https://rooftop.altio.ch/',
            'altio/realisations/gerard-paley.jpg':'https://gpaley.ch/fr',
            'altio/realisations/marcus.jpg':'https://marcus.altio.ch/',
            'altio/realisations/myswissinvoice.jpg':'https://myswissinvoice.ch/',
            'altio/realisations/relumo.jpg':'https://relumo.ch/',
            'altio/realisations/propulsa.jpg':'https://propulsa.ch/',
          }
          rows=[]
          if os.path.exists(manifest):
            with open(manifest,newline='',encoding='utf-8') as h: rows=list(csv.DictReader(h))
          rows=[r for r in rows if not (r.get('project')=='altio' and r.get('relative_path') in urls)]
          for p,u in urls.items():
            if not os.path.exists(p): continue
            sha=hashlib.sha256(open(p,'rb').read()).hexdigest()
            stem=os.path.splitext(os.path.basename(p))[0]
            rows.append({
              'asset_id':'altio-'+stem,'project':'altio','relative_path':p,'filename':os.path.basename(p),
              'source_type':'public_capture','source_url':u,'source_reference':'altio-capture-workflow',
              'created_at':str(date.today()),'sha256':sha,'channels':'','github_path':p,
              'github_public_url':'https://raw.githubusercontent.com/danielmaitredarest/content-engine-assets/main/'+p,
              'status':'ready','notes':'Reusable public capture; cookie/consent overlays removed before capture.'
            })
          with open(manifest,'w',newline='',encoding='utf-8') as h:
            w=csv.DictWriter(h,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY

      - name: Commit captures
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add altio
          if ! git diff --cached --quiet; then
            git commit -m "Add reusable Altio public site captures"
            git push
          fi
